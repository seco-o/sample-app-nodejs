apiVersion: cci/v2
kind: Deployment
metadata:
  name: cae-frontend
  namespace: sercan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cae-frontend
  template:
    metadata:
      labels:
        app: cae-frontend
    spec:
      containers:
        - name: cae-frontend
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
      dnsPolicy: Default
